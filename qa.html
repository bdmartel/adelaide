<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Adelaide QA — Sprint Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#111114;color:#e0e0e6;line-height:1.5;padding:0}
  .top{position:sticky;top:0;z-index:10;background:#111114;border-bottom:1px solid #2a2a32;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top h1{font-size:1rem;font-weight:800;white-space:nowrap}
  .top .links{display:flex;gap:6px;flex-wrap:wrap}
  .top a{font-size:0.6rem;font-weight:600;padding:3px 8px;border-radius:3px;text-decoration:none;color:#ccc;border:1px solid #333;transition:all .12s;white-space:nowrap}
  .top a:hover{background:#333;color:#fff}
  .top a.blue{background:#1e2d4a;border-color:#2e4d7a;color:#7ab}
  .top a.green{background:#1e3d28;border-color:#2e6d48;color:#7b9}
  .top a.amber{background:#2a2520;border-color:#4a3520;color:#da8}
  .stream{max-width:800px;margin:0 auto;padding:16px 20px 60px}
  .card{border:1px solid #2a2a32;border-radius:8px;margin-bottom:12px;overflow:hidden;transition:border-color .15s}
  .card:target{border-color:#5b8ad4;box-shadow:0 0 0 1px #5b8ad4}
  .card-head{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
  .card-head:hover{background:#1a1a1f}
  .card-check{width:20px;height:20px;border:2px solid #444;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;transition:all .15s}
  .card-check.done{background:#4ade80;border-color:#4ade80}
  .card-check.done svg{opacity:1}
  .card-check svg{opacity:0;transition:opacity .15s}
  .card-num{font-family:'JetBrains Mono',monospace;font-size:0.65rem;font-weight:600;color:#666;min-width:18px;margin-top:3px}
  .card-body{flex:1;min-width:0}
  .card-summary{font-size:0.85rem;font-weight:600;line-height:1.3}
  .card-cat{font-size:0.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .cat-print{color:#d4a843}
  .cat-web{color:#5b8ad4}
  .cat-delivery{color:#5bbd72}
  .card-detail{padding:0 14px 12px 44px;font-size:0.78rem;color:#999;line-height:1.5;display:none}
  .card.open .card-detail{display:block}
  .card.checked .card-summary{text-decoration:line-through;opacity:.45}
  .card-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .card-links a{font-size:0.62rem;font-family:'JetBrains Mono',monospace;font-weight:600;padding:3px 7px;border-radius:3px;text-decoration:none;transition:all .12s}
  .card-links a.stg{background:#1e2d4a;border:1px solid #2e4d7a;color:#7ab}
  .card-links a.stg:hover{background:#2e4d7a}
  .card-links a.des{background:#2a2520;border:1px solid #4a3520;color:#da8}
  .card-links a.des:hover{background:#4a3520}
  .divider{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:16px 0 6px;border-bottom:1px solid #2a2a32;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .divider .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.print{background:#d4a843}
  .dot.web{background:#5b8ad4}
  .dot.delivery{background:#5bbd72}
  .kbd{font-family:'JetBrains Mono',monospace;font-size:.55rem;background:#222;border:1px solid #333;border-radius:3px;padding:1px 4px;color:#888}
  .ref-img{width:100%;max-width:750px;border:1px solid #2a2a32;border-radius:6px;margin:8px 0 4px;cursor:pointer;transition:all .15s}
  .ref-img:hover{border-color:#555}
  .ref-label{font-size:.6rem;color:#666;font-family:'JetBrains Mono',monospace;margin-bottom:8px;display:block}
  .div-links{display:inline-flex;gap:4px;margin-left:auto}
  .div-links a{font-size:.55rem;font-weight:700;padding:2px 6px;border-radius:3px;text-decoration:none;transition:all .12s}
  .div-links a.dl-stg{background:#1e2d4a;color:#7ab;border:1px solid #2e4d7a}
  .div-links a.dl-des{background:#2a2520;color:#da8;border:1px solid #4a3520}
  .div-links a.dl-spec{background:#2a1e2e;color:#c08ada;border:1px solid #4a2e6a}
  .div-links a:hover{filter:brightness(1.3)}
  .card-links a.spec{background:#2a1e2e;border:1px solid #4a2e6a;color:#c08ada}
  .card-links a.spec:hover{background:#4a2e6a}
  .card-comment{margin:6px 0 0 44px;padding-right:14px}
  .card-comment textarea{width:100%;background:#16161a;border:1px solid #2a2a32;border-radius:4px;color:#ccc;font-family:'Inter',sans-serif;font-size:.72rem;padding:6px 8px;resize:vertical;min-height:28px;max-height:120px;line-height:1.4;transition:border-color .15s}
  .card-comment textarea:focus{outline:none;border-color:#5b8ad4}
  .card-comment textarea::placeholder{color:#444}
</style>

const BASE="https://adelaide-2713ba.webflow.io";
const DES="https://adelaide-2713ba.design.webflow.com?pageId=";
let checked=JSON.parse(localStorage.getItem("qa-checked")||"{}");
let comments=JSON.parse(localStorage.getItem("qa-comments")||"{}");

// Double-persist: localStorage + URL hash for comments
function loadFromHash(){
  try{
    const h=location.hash;
    if(!h||!h.includes("d="))return;
    const d=decodeURIComponent(h.split("d=")[1]);
    const parsed=JSON.parse(d);
    if(parsed.c)Object.assign(checked,parsed.c);
    if(parsed.n)Object.assign(comments,parsed.n);
  }catch(e){}
}
loadFromHash();

function persistAll(){
  localStorage.setItem("qa-checked",JSON.stringify(checked));
  localStorage.setItem("qa-comments",JSON.stringify(comments));
  // Also encode in hash for durability
  const hasComments=Object.values(comments).some(v=>v&&v.trim());
  const hasChecked=Object.values(checked).some(v=>v);
  if(hasComments||hasChecked){
    const payload={};
    if(hasChecked)payload.c=checked;
    if(hasComments){
      const clean={};
      Object.entries(comments).forEach(([k,v])=>{if(v&&v.trim())clean[k]=v});
      payload.n=clean;
    }
    history.replaceState(null,null,"#d="+encodeURIComponent(JSON.stringify(payload)));
  }
}

function save(){persistAll()}
function saveComment(id,val){comments[id]=val;persistAll()}

function toggle(id){
  checked[id]=!checked[id];
  save();
  const card=document.getElementById("c"+id);
  const box=card.querySelector(".card-check");
  if(checked[id]){card.classList.add("checked");box.classList.add("done")}
  else{card.classList.remove("checked");box.classList.remove("done")}
}

function render(){
  const s=document.getElementById("stream");
  let h="";
  DATA.forEach(group=>{
    let divLinks='<div class="div-links">';
    if(group.stg)divLinks+=`<a class="dl-stg" href="${BASE}${group.stg}" target="_blank">View ↗</a>`;
    if(group.des)divLinks+=`<a class="dl-des" href="${DES}${group.des}" target="_blank">Designer ↗</a>`;
    if(group.stg2)divLinks+=`<a class="dl-stg" href="${BASE}${group.stg2}" target="_blank">P3 View ↗</a>`;
    if(group.des2)divLinks+=`<a class="dl-des" href="${DES}${group.des2}" target="_blank">P3 Des ↗</a>`;
    if(group.spec)divLinks+=`<a class="dl-spec" href="${group.spec}" target="_blank">${group.specLabel||"Design PDF"} ↗</a>`;
    divLinks+='</div>';
    h+=`<div class="divider"><span class="dot ${group.t}"></span>${group.s}${divLinks}</div>`;
    if(group.img){h+=`<img class="ref-img" src="${group.img}" onclick="window.open(this.src)" title="Click to enlarge"><span class="ref-label">Kristen's annotated PDF — click to enlarge</span>`;}
    if(group.img2){h+=`<img class="ref-img" src="${group.img2}" onclick="window.open(this.src)" title="Click to enlarge"><span class="ref-label">Page 2 — click to enlarge</span>`;}
    group.items.forEach(item=>{
      if(group.spec){item._spec=group.spec;item._specLabel=group.specLabel;}
      const ck=checked[item.id];
      h+=`<div class="card${ck?" checked":""}" id="c${item.id}" onclick="this.classList.toggle('open')">
        <div class="card-head">
          <div class="card-check${ck?" done":""}" onclick="event.stopPropagation();toggle(${item.id})"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5L4.5 9L10 3" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <span class="card-num">${item.id}</span>
          <div class="card-body">
            <div class="card-summary">${item.sum}</div>
          </div>
        </div>
        <div class="card-detail" onclick="event.stopPropagation()">
          ${item.det}
          <div class="card-links">
            ${item.stg?`<a class="stg" href="${BASE}${item.stg}" target="_blank">Staging ↗</a>`:""}
            ${item.des?`<a class="des" href="${DES}${item.des}" target="_blank">Designer ↗</a>`:""}
            ${item._spec?`<a class="spec" href="${item._spec}" target="_blank">${item._specLabel||"Design PDF"} ↗</a>`:""}
          </div>
          <div class="card-comment"><textarea placeholder="Add a note..." data-cid="${item.id}" oninput="saveComment(${item.id},this.value)">${comments[item.id]||""}</textarea></div>
        </div>
      </div>`;
    });
  });
  s.innerHTML=h;
}
render();
</script>
